name: Verify and deploy Mission Hero

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - VERSION

concurrency:
  group: mission-hero-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release version and changelog
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: node scripts/check-release.mjs "$PREVIOUS_SHA"
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
